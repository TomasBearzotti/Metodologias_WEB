openapi: 3.0.3
info:
  title: Movie Catalog API
  version: 1.0.0
  description: API RESTful para el catálogo de películas con autenticación Better Auth y control de acceso por roles.
servers:
  - url: /api/v1
    description: Base path relativo de la API v1

paths:
  /movies:
    get:
      summary: Listar películas con paginación, búsqueda y filtros
      description: Acceso público. Devuelve la lista paginada de películas.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Término de búsqueda en título o director
        - name: genre
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por género específico
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, title, year]
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Lista de películas paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMovies"
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Crear una nueva película
      description: Requiere sesión activa y rol admin (authMiddleware + requireRole("admin")).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieInput"
      responses:
        "201":
          description: Película creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Error de validación Zod en campos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Sesión no iniciada o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permisos insuficientes (requiere rol admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /movies/{id}:
    get:
      summary: Obtener detalle de una película por ID
      description: Acceso público. Devuelve la película con todos sus atributos.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB ObjectId de la película
      responses:
        "200":
          description: Película encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Formato de ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Película no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Actualizar una película por ID
      description: Requiere sesión activa y rol admin.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMovieInput"
      responses:
        "200":
          description: Película actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: ID inválido o error de validación Zod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Sesión no iniciada
        "403":
          description: Permisos insuficientes
        "404":
          description: Película no encontrada

    delete:
      summary: Eliminar una película por ID
      description: Requiere sesión activa y rol admin.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Película eliminada exitosamente (sin contenido)
        "400":
          description: ID inválido
        "401":
          description: Sesión no iniciada
        "403":
          description: Permisos insuficientes
        "404":
          description: Película no encontrada

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  schemas:
    Movie:
      type: object
      required:
        - _id
        - title
        - synopsis
        - director
        - year
        - genre
        - posterUrl
        - isAvailable
        - releaseDate
      properties:
        _id:
          type: string
        title:
          type: string
        synopsis:
          type: string
        director:
          type: string
        year:
          type: integer
        genre:
          type: string
        posterUrl:
          type: string
        isAvailable:
          type: boolean
        releaseDate:
          type: string
          format: date-time
        reviews:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMovieInput:
      type: object
      required:
        - title
        - synopsis
        - director
        - year
        - genre
        - posterUrl
      properties:
        title:
          type: string
          maxLength: 150
        synopsis:
          type: string
          maxLength: 2000
        director:
          type: string
          maxLength: 100
        year:
          type: integer
          minimum: 1888
        genre:
          type: string
        posterUrl:
          type: string
          format: uri
        isAvailable:
          type: boolean
          default: true
        releaseDate:
          type: string
          format: date-time

    UpdateMovieInput:
      type: object
      properties:
        title:
          type: string
        synopsis:
          type: string
        director:
          type: string
        year:
          type: integer
        genre:
          type: string
        posterUrl:
          type: string
        isAvailable:
          type: boolean
        releaseDate:
          type: string

    PaginatedMovies:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        meta:
          type: object
          required:
            - total
            - page
            - limit
            - totalPages
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string

    ValidationErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
